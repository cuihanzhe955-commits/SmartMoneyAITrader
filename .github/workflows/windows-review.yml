name: Windows paper regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SMART_MONEY_RUNTIME: ${{ runner.temp }}/paper-runtime
      SMART_MONEY_UI_OUTPUT: ${{ runner.temp }}/paper-browser
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - run: python -m pip install --require-hashes -r requirements-win-py312.lock
      - run: python -m pip install pytest==9.2.0 httpx==0.28.1 playwright==1.64.1
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: python -X utf8 -B tests/run_offline.py
      - run: python -X utf8 -B tests/event_research_browser.py
      - run: python -X utf8 -B tests/prediction_challenge_browser.py
