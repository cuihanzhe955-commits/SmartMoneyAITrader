name: Windows paper regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Set isolated paths
        run: |
          "SMART_MONEY_RUNTIME=$env:RUNNER_TEMP/paper-runtime" >> $env:GITHUB_ENV
          "SMART_MONEY_UI_OUTPUT=$env:RUNNER_TEMP/paper-browser" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - run: python -m pip install --require-hashes -r requirements-win-py312.lock
      - run: python -m pip install pytest==9.2.0 httpx==0.28.1 playwright==1.64.1
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: python -X utf8 -B tests/run_offline.py
      - run: python -X utf8 -B tests/run_browsers.py
      - run: .\start.bat --install-only
      - run: python -X utf8 -B tests/windows_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-browser-logs
          path: artifacts/browser-suite/
